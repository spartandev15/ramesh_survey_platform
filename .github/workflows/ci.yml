name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: psg
          POSTGRES_PASSWORD: psg
          POSTGRES_DB: psg_survey
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U psg -d psg_survey"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://psg:psg@localhost:5432/psg_survey
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      # Migrations must apply cleanly to an empty database.
      - run: npm run db:migrate
      # Schema and committed migrations must agree.
      - run: npx drizzle-kit check
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t psg-survey:ci .
