# Local development and single-server deployment.
#
#   docker compose up -d db                  # only the database, for `npm run dev`
#   docker compose --profile app up -d       # full stack: db, migrate, web, worker
#
# With EMAIL_PROVIDER=log every email is written to the web/worker logs instead of being sent.
#
# Ports are bound to this machine only. In production put one reverse proxy in front of web that
# overwrites X-Forwarded-For with the client address (nginx: proxy_set_header X-Forwarded-For $remote_addr;)
# and set POSTGRES_PASSWORD in .env: rate limits trust that header.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: psg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psg}
      POSTGRES_DB: psg_survey
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psg -d psg_survey"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ["app"]
    build: .
    command: ["node", "dist/migrate.mjs"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://psg:${POSTGRES_PASSWORD:-psg}@db:5432/psg_survey
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://psg:${POSTGRES_PASSWORD:-psg}@db:5432/psg_survey
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: ["app"]
    build: .
    # One bundled file run by node directly: no npm or tsx process held in memory.
    command: ["node", "dist/worker.mjs"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://psg:${POSTGRES_PASSWORD:-psg}@db:5432/psg_survey
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
