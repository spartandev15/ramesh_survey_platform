# Reverse proxy for the PSG Survey app (one server). Replace survey.example.com,
# get a certificate (for example: certbot --nginx -d survey.example.com), then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/psg-survey
#   sudo ln -s /etc/nginx/sites-available/psg-survey /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# The app listens on 127.0.0.1:3000 only (docker-compose.yml); this is the one way in.

# Survey links and password-reset links carry bearer tokens: the access log keeps the path without them.
map $request_uri $psg_loggable_uri {
  ~^/survey/opt-out/          "/survey/opt-out/[redacted]";
  ~^/survey/shop/             $request_uri;
  ~^/survey/[^/?]{20,}        "/survey/[redacted]";
  ~^/api/auth/reset-password/ "/api/auth/reset-password/[redacted]";
  ~^/reset-password\?         "/reset-password?[redacted]";
  default                     $request_uri;
}
log_format psg_redacted '$remote_addr - $remote_user [$time_local] "$request_method $psg_loggable_uri $server_protocol" '
                        '$status $body_bytes_sent "-" "$http_user_agent"';

server {
  listen 80;
  server_name survey.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name survey.example.com;

  ssl_certificate     /etc/letsencrypt/live/survey.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/survey.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  access_log /var/log/nginx/psg-survey.access.log psg_redacted;

  # Visit imports are capped at 5 MB in the app.
  client_max_body_size 6m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append: rate limits trust this header (TRUSTED_PROXY_HOPS=1).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
